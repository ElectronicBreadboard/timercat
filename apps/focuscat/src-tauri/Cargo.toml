[package]
name = "focuscat"
version = "0.0.15"
description = ""
authors = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
app-store = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focuscat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.10.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2.5.3"
tauri-plugin-os = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
specta = { version = "2.0.0-rc.22", features = ["derive"] }
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "0.0.9"
png = "0.18.0"
chrono = "0.4.43"
tokio = { version = "1.49.0", features = ["sync", "macros", "time"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate"] }
# Git version required for `set_is_main_thread()` fix - crashes on macOS keyboard events without it.
# See: https://github.com/Narsil/rdev/issues/165
# TODO: Switch to crates.io version once 0.5.4+ is released with this fix.
rdev = { git = "https://github.com/Narsil/rdev.git", rev = "c14f2dc" }
mado = { path = "../../../crates/mado" }
focuscat-macos = { path = "../crates/macos" }
nucleo-matcher = "0.3.1"
rodio = "0.21.1"
