name: 🚀 Develop

on:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: 🔍 CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI
        uses: ./.github/actions/ci
        with:
          app: focuscat

  check-deploy:
    name: 🔍 Check Deploy Marker
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
    steps:
      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"#patch"* ]] || [[ "$COMMIT_MSG" == *"#deploy"* ]]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Deploy marker found in commit message"
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
            echo "⏭️  No deploy marker found, skipping deployment"
          fi

  version-bump:
    name: 📦 Version Bump
    runs-on: ubuntu-latest
    needs: check-deploy
    if: needs.check-deploy.outputs.should-deploy == 'true'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version
        id: bump
        uses: ./.github/actions/version-bump
        with:
          app: focuscat
          app-directory: apps/focuscat

  build:
    name: 📦 Build ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    needs: version-bump
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin develop

      - name: Build Tauri app
        uses: ./.github/actions/build-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          app: focuscat
          app-directory: apps/focuscat
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          args: ${{ matrix.args }}
          config: prod

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version-bump.outputs.tag }}
          name: Focuscat v${{ needs.version-bump.outputs.version }}
          body: |
            ## Focuscat v${{ needs.version-bump.outputs.version }}
            
            Auto-deployed from develop branch.
            
            ### Changes
            ${{ github.event.head_commit.message }}
          draft: false
          prerelease: true
          files: |
            apps/focuscat/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/focuscat/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
          fail_on_unmatched_files: false
